name: CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

  deploy:
    needs: test
    runs-on: self-hosted

    steps:
      - name: Deploy to EC2
        run: |
          cd /home/ubuntu/HABIT-TRACKER-API
          git pull --ff-only origin main
          docker compose up -d --build
          docker compose ps      